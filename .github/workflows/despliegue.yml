name: Despliegue Automático

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código de tu repositorio
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    # 2. Configurar Node.js (versión estable recomendada para Create React App)
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    # 3. Instalar dependencias y compilar el proyecto (aquí se genera la carpeta 'build')
    - name: Instalar y Compilar Proyecto
      run: |
        npm ci
        npm run build

    # 4. Subir ÚNICAMENTE la carpeta de producción ('build') a tu FTP
    - name: Sincronizar archivos por FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./demos/LittleLemon/
        local-dir: ./build/